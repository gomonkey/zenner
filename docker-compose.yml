services:
  postgres:
    image: postgres:17
    container_name: zenner-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenner_dev}
      POSTGRES_USER: ${POSTGRES_USER:-zenner_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Zenner!2026}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenner_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
