# Production compose file for zenner-core
# 
# This can be used to run zenner-core standalone in production.
# For full stack deployment, use the root docker/docker-compose.prod.yml instead.
#
# Note: This expects an external PostgreSQL instance with the zenner_core schema.
# Configure connection via environment variables or .env.prod file.
#
# Usage:
#   docker-compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d

services:
  zenner-core:
    build: ../
    container_name: zenner-core
    restart: unless-stopped
    env_file:
      - ../.env.prod
    ports:
      - "${EXTERNAL_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
