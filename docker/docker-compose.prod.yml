# Production compose file for zenner
# 
# This orchestrates the complete zenner stack:
#   - Shared PostgreSQL database (with zenner_auth and zenner_core schemas)
#   - zenner-auth service (included from zenner-auth/docker/docker-compose.prod.yml)
#   - zenner-core service (included from zenner-core/docker/docker-compose.prod.yml)
#
# Usage:
#   Start all services: docker-compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d
#   Stop all services: docker-compose -f docker/docker-compose.prod.yml down
#   View logs:         docker-compose -f docker/docker-compose.prod.yml logs -f

name: zenner

services:
  postgres:
    image: postgres:17
    container_name: zenner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init/init-schemas-prod.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenner-network

  # zenner-auth service configuration
  zenner-auth:
    build: ../zenner-auth
    image: zenner-auth
    container_name: zenner-auth
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - ../zenner-auth/.env.prod
    environment:
      # Override database connection to use shared postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=zenner_auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zenner-network

  # zenner-core service configuration
  zenner-core:
    build: ../zenner-core
    image: zenner-core
    container_name: zenner-core
    restart: unless-stopped
    ports:
      - "8081:8080"
    env_file:
      - ../zenner-core/.env.prod
    environment:
      # Override database connection to use shared postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=zenner_core
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      zenner-auth:
        condition: service_healthy
    networks:
      - zenner-network

volumes:
  postgres_data:

networks:
  zenner-network:
    driver: bridge
