# Production compose file for zenner
# 
# This orchestrates the complete zenner stack:
#   - PostgreSQL database (with default public schema)
#   - Redis cache & session store
#   - zenner-core service (backend monolithic service on port 8080)
#
# Usage:
#   Start all services: docker-compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d
#   Stop all services: docker-compose -f docker/docker-compose.prod.yml down
#   View logs:         docker-compose -f docker/docker-compose.prod.yml logs -f

name: zenner

services:
  postgres:
    image: postgres:17
    container_name: zenner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../init/init-schemas-prod.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenner-network

  redis:
    image: redis:7-alpine
    container_name: zenner-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zenner-network

  # zenner-core service configuration
  zenner-core:
    build: ../zenner-core
    image: zenner-core
    container_name: zenner-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../zenner-core/.env.prod
    environment:
      # Override database and redis connection
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - zenner-network

volumes:
  postgres_data:
  redis_data:

networks:
  zenner-network:
    driver: bridge
