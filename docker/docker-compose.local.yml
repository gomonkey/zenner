# Local development compose file for zenner
# 
# This provides PostgreSQL and Redis for zenner-core.
#
# Usage:
#   Start services: docker-compose -f docker/docker-compose.local.yml up -d
#   Stop services:  docker-compose -f docker/docker-compose.local.yml down
#
# Then run zenner-core directly via IDE or Maven:
#   cd zenner-core && ./mvnw spring-boot:run

name: zenner

services:
  postgres:
    image: postgres:17
    container_name: zenner-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zenner_dev}
      POSTGRES_USER: ${POSTGRES_USER:-zenner_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ../init/init-schemas-local.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zenner_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zenner-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data_dev:
  redis_data_dev:
